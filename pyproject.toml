[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reconcilex"
version = "1.0.0"
description = "Hybrid Privacy-First Financial Reconciliation Engine (MCP Server, Deterministic Math, Local/Cloud LLM, and Modern Web Dashboard)"
readme = "README.md"
authors = [{ name = "Ahmed Khaled (Ahmed Algendy)", email = "contact@ahmedalgendy.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "reconciliation",
    "accounting",
    "fintech",
    "mcp",
    "model-context-protocol",
    "fastapi",
    "llm",
    "ollama",
    "audit",
    "ocr",
    "arabic-ocr"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "rapidfuzz>=3.6.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pillow>=10.2.0",
    "pdfplumber>=0.10.0",
    "pypdf>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3"
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0"
]
ocr = [
    "easyocr>=1.7.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
reconcilex = "reconcilex.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib --basetemp=./data/test_tmp"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
